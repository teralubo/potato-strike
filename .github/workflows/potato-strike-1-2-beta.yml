name: Potato Strike V1.4 FINAL PATCH-1.0 Compatibility Builds

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional release/build note"
        required: false
        default: "manual compatibility build"
  push:
    tags:
      - "v*"

concurrency:
  group: potato-strike-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-compat:
    name: Desktop compatibility (${{ matrix.os }} / ${{ matrix.script }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            script: build:win:compat
            artifact: potato-strike-windows-compat
            path: |
              dist/*.exe
          - os: linux
            runner: ubuntu-latest
            script: build:linux:compat
            artifact: potato-strike-linux-compat
            path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
              dist/*.tar.gz
              dist/linux-unpacked/**
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:single
      - name: Build desktop package
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: npm ci
      - run: npm run build:single
      - run: npm run phone:sync
      - name: Build APK
        working-directory: phone/android
        run: gradle assembleDebug
      - name: Collect APK
        run: |
          cp phone/android/app/build/outputs/apk/debug/app-debug.apk phone/android/PotatoStrike-1.3-FINAL-PATCH-1.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: potato-strike-android-apk
          path: phone/android/PotatoStrike-1.3-FINAL-PATCH-1.3.apk

  flipperzero-fap:
    name: Flipper Zero FAP (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: official
            sdk_index: https://update.flipperzero.one/firmware/directory.json
            output: PotatoStrikeMini-1.3-FINAL-PATCH-1.3-official.fap
          - firmware: momentum
            sdk_index: https://up.momentum-fw.dev/firmware/directory.json
            output: PotatoStrikeMini-1.3-FINAL-PATCH-1.3-momentum.fap
          - firmware: unleashed
            sdk_index: https://up.unleashedflip.com/directory.json
            output: PotatoStrikeMini-1.3-FINAL-PATCH-1.3-unleashed.fap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ufbt
        run: python -m pip install --upgrade ufbt
      - name: Select firmware SDK
        working-directory: phone/flipperzero
        run: ufbt update --index-url=${{ matrix.sdk_index }}
      - name: Build FAP
        working-directory: phone/flipperzero
        run: ufbt
      - name: Collect FAP
        working-directory: phone/flipperzero
        shell: bash
        run: |
          mkdir -p dist
          fap_file="$(find . -name '*.fap' -type f | head -n 1)"
          test -n "$fap_file"
          cp "$fap_file" "dist/${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: potato-strike-flipperzero-${{ matrix.firmware }}-fap
          path: phone/flipperzero/dist/${{ matrix.output }}

  release-folder:
    name: Compatibility ZIP
    runs-on: ubuntu-latest
    needs:
      - desktop-compat
      - android-apk
      - flipperzero-fap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:compat
      - run: npm run package:beta-final
      - uses: actions/download-artifact@v4
        with:
          name: potato-strike-android-apk
          path: dist/PotatoStrike-V1.4-FINAL-PATCH-1.0/phone/android
      - uses: actions/download-artifact@v4
        with:
          pattern: potato-strike-flipperzero-*-fap
          path: dist/PotatoStrike-V1.4-FINAL-PATCH-1.0/phone/flipperzero
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: potato-strike-windows-compat
          path: dist/PotatoStrike-V1.4-FINAL-PATCH-1.0/compat/builds/windows
      - uses: actions/download-artifact@v4
        with:
          name: potato-strike-linux-compat
          path: dist/PotatoStrike-V1.4-FINAL-PATCH-1.0/compat/builds/linux
      - name: Repack with binaries
        run: |
          rm -f PotatoStrike-V1.4-FINAL-PATCH-1.0.zip
          cd dist
          zip -qr ../PotatoStrike-V1.4-FINAL-PATCH-1.0.zip PotatoStrike-V1.4-FINAL-PATCH-1.0
      - uses: actions/upload-artifact@v4
        with:
          name: potato-strike-v1.4-final-patch-1.0
          path: PotatoStrike-V1.4-FINAL-PATCH-1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: potato-strike-v1.4-beta-final-patch-1.0-compressed
          path: PotatoStrike-V1.4-BETA-FINAL-PATCH-1.0.zip
