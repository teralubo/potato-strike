name: Potato Strike 1.1 BETA Compatibility Builds

on:
  workflow_dispatch:
  push:
    branches:
      - beta
      - main
    tags:
      - "v1.1-BETA"
      - "v1.1-beta"

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: npm ci
      - run: npm run build:single
      - run: npm run phone:sync
      - name: Build APK
        working-directory: phone/android
        run: gradle assembleDebug
      - name: Collect APK
        run: |
          mkdir -p phone/apk
          cp phone/android/app/build/outputs/apk/debug/app-debug.apk phone/apk/PotatoStrike-1.1-BETA-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: potato-strike-android-apk
          path: phone/apk/PotatoStrike-1.1-BETA-debug.apk

  flipperzero-fap:
    name: Flipper Zero FAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ufbt
        run: python -m pip install --upgrade ufbt
      - name: Build FAP
        working-directory: phone/flipperzero
        run: ufbt
      - uses: actions/upload-artifact@v4
        with:
          name: potato-strike-flipperzero-fap
          path: phone/flipperzero/dist/*.fap

  release-folder:
    name: Compatibility ZIP
    runs-on: ubuntu-latest
    needs:
      - android-apk
      - flipperzero-fap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:compat
      - uses: actions/download-artifact@v4
        with:
          name: potato-strike-android-apk
          path: dist/PotatoStrike-1.1-BETA/phone
      - uses: actions/download-artifact@v4
        with:
          name: potato-strike-flipperzero-fap
          path: dist/PotatoStrike-1.1-BETA/phone/flipperzero
      - name: Repack with binaries
        run: |
          rm -f PotatoStrike-1.1-BETA.zip
          cd dist
          zip -qr ../PotatoStrike-1.1-BETA.zip PotatoStrike-1.1-BETA
      - uses: actions/upload-artifact@v4
        with:
          name: potato-strike-1.1-beta-folder
          path: PotatoStrike-1.1-BETA.zip
